<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowBridge Advisory | CRM Voice Agent</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-active: #0ea5e9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 { font-size: 1.5rem; margin: 0; font-weight: 600; }
    .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: -12px; }
    .status-badge {
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(148, 163, 184, 0.2);
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .connected .status-dot { background: var(--success); }
    .connected { color: var(--success); background: rgba(34, 197, 94, 0.15); }

    .mic-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #0f172a;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    .mic-btn:hover { background: var(--accent-active); transform: scale(1.03); }
    .mic-btn.active {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
    }
    .config-field { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .config-field label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .config-field input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    #errorBox {
      display: none;
      width: 100%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: monospace;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CRM Voice Assistant</h1>
    <div class="subtitle">FlowBridge Advisory — Friction to Flow</div>
    
    <div id="statusBadge" class="status-badge">
      <div class="status-dot"></div>
      <span id="statusText">Disconnected</span>
    </div>

    <div id="errorBox"></div>

    <div class="config-field">
      <label>Backend WebSocket Gateway URL</label>
      <input type="text" id="wsUrlInput" />
    </div>

    <button id="toggleBtn" class="mic-btn">Start</button>

    <div style="font-size:0.85rem; color:var(--muted); text-align:center;">
      Tap <strong>Start</strong>, allow your mic, and speak in Arabic or English.
    </div>
  </div>

  <script>
    const wsUrlInput = document.getElementById("wsUrlInput");

    const isSecure = window.location.protocol === "https:";
    const wsProto = isSecure ? "wss:" : "ws:";
    if (window.location.hostname === "localhost" && window.location.port === "3000") {
      wsUrlInput.value = "ws://localhost:8000/ws/voice-crm";
    } else {
      wsUrlInput.value = `${wsProto}//${window.location.host}/ws/voice-crm`;
    }

    const toggleBtn = document.getElementById("toggleBtn");
    const statusBadge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    const errorBox = document.getElementById("errorBox");

    let ws = null;
    let inputAudioCtx = null;
    let outputAudioCtx = null;
    let micStream = null;
    let workletNode = null;
    let isConnected = false;
    let scheduledAudioTime = 0;
    const activeSources = new Set();

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.innerText = `Error: ${msg}`;
      console.error("UI Error:", msg);
    }

    function clearError() {
      errorBox.style.display = "none";
      errorBox.innerText = "";
    }

    toggleBtn.onclick = async () => {
      clearError();
      if (!isConnected) {
        await startAll();
      } else {
        stopAll();
      }
    };

    async function startAll() {
      const url = wsUrlInput.value.trim();
      statusText.innerText = "Requesting mic & connecting...";

      try {
        // 1. Create AudioContexts
        inputAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        outputAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });

        if (inputAudioCtx.state === 'suspended') await inputAudioCtx.resume();
        if (outputAudioCtx.state === 'suspended') await outputAudioCtx.resume();

        // 2. Load static AudioWorklet processor from same-origin file
        await inputAudioCtx.audioWorklet.addModule("/pcm-processor.js");

        // 3. Request microphone access
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true }
        });

        // 4. Open WebSocket connection
        ws = new WebSocket(url);

        ws.onopen = () => {
          isConnected = true;
          statusBadge.classList.add("connected");
          statusText.innerText = "Live & Listening";
          toggleBtn.innerText = "Stop";
          toggleBtn.classList.add("active");

          startAudioWorkletStreaming();
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "error") {
              showError(data.message);
              stopAll();
            } else if (data.type === "audio_delta" && data.audio) {
              playPcm24k(data.audio);
            } else if (data.type === "interrupted") {
              flushAudio();
            }
          } catch (e) {
            console.warn("Parse error:", e);
          }
        };

        ws.onerror = (e) => {
          showError(`WebSocket connection error on ${url}.`);
          stopAll();
        };

        ws.onclose = (e) => {
          console.warn("WebSocket closed:", e.code, e.reason);
          if (e.code === 1008) {
            showError("Access Denied (1008): GEMINI_API_KEY invalid or missing.");
          } else if (e.code !== 1000 && e.code !== 1005) {
            showError(`WebSocket closed (Code: ${e.code})`);
          }
          stopAll();
        };

      } catch (err) {
        showError(err.message || err);
        stopAll();
      }
    }

    function startAudioWorkletStreaming() {
      if (!inputAudioCtx || inputAudioCtx.state === 'closed') return;

      const source = inputAudioCtx.createMediaStreamSource(micStream);
      workletNode = new AudioWorkletNode(inputAudioCtx, "pcm-processor");

      workletNode.port.onmessage = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        let binary = '';
        const bytes = new Uint8Array(e.data);
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        const base64Audio = btoa(binary);

        ws.send(JSON.stringify({
          type: "audio_input",
          audio: base64Audio
        }));
      };

      source.connect(workletNode);
      const muteGain = inputAudioCtx.createGain();
      muteGain.gain.value = 0;
      workletNode.connect(muteGain);
      muteGain.connect(inputAudioCtx.destination);
    }

    function playPcm24k(base64Pcm) {
      if (!outputAudioCtx || outputAudioCtx.state === 'closed') return;

      const binary = atob(base64Pcm);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

      const buffer = outputAudioCtx.createBuffer(1, float32.length, 24000);
      buffer.copyToChannel(float32, 0);

      const src = outputAudioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(outputAudioCtx.destination);

      const now = outputAudioCtx.currentTime;
      const start = Math.max(now, scheduledAudioTime);
      src.start(start);
      scheduledAudioTime = start + buffer.duration;

      activeSources.add(src);
      src.onended = () => activeSources.delete(src);
    }

    function flushAudio() {
      activeSources.forEach(s => {
        try { s.stop(); } catch (_) {}
      });
      activeSources.clear();
      if (outputAudioCtx && outputAudioCtx.state !== 'closed') {
        scheduledAudioTime = outputAudioCtx.currentTime;
      }
    }

    function stopAll() {
      const prevWs = ws;
      ws = null;
      isConnected = false;

      statusBadge.classList.remove("connected");
      statusText.innerText = "Disconnected";
      toggleBtn.innerText = "Start";
      toggleBtn.classList.remove("active");

      if (workletNode) {
        workletNode.disconnect();
        workletNode = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (inputAudioCtx && inputAudioCtx.state !== 'closed') {
        inputAudioCtx.close();
      }
      if (outputAudioCtx && outputAudioCtx.state !== 'closed') {
        outputAudioCtx.close();
      }
      if (prevWs && prevWs.readyState === WebSocket.OPEN) {
        prevWs.close(1000, "User stopped session");
      }
    }
  </script>
</body>
</html>
