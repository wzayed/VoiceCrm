<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowBridge Advisory | CRM Voice Agent v2.2</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-active: #0ea5e9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 { font-size: 1.45rem; margin: 0; font-weight: 600; }
    .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: -10px; }
    .status-badge {
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(148, 163, 184, 0.2);
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .connected .status-dot { background: var(--success); }
    .connected { color: var(--success); background: rgba(34, 197, 94, 0.15); }

    .mic-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #0f172a;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    .mic-btn:hover { background: var(--accent-active); transform: scale(1.03); }
    .mic-btn.active {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
    }
    .meter-wrap {
      width: 100%;
      height: 6px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 999px;
      overflow: hidden;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: var(--success);
      transition: width 0.08s ease;
    }
    .config-field { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .config-field label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; }
    .config-field input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .transcript-box {
      width: 100%;
      height: 220px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.5;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-user { color: #38bdf8; align-self: flex-end; text-align: right; }
    .msg-assistant { color: #f8fafc; align-self: flex-start; }
    .msg-thought { color: #94a3b8; font-size: 0.8rem; font-style: italic; }
    .msg-tool { color: #facc15; font-size: 0.8rem; font-family: monospace; }
    #errorBox {
      display: none;
      width: 100%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: monospace;
      word-break: break-all;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CRM Voice Assistant <span style="font-size:0.75rem; color:#38bdf8;">v2.2</span></h1>
    <div class="subtitle">FlowBridge Advisory — Friction to Flow</div>
    
    <div id="statusBadge" class="status-badge">
      <div class="status-dot"></div>
      <span id="statusText">Disconnected</span>
    </div>

    <div id="errorBox"></div>

    <div class="config-field">
      <label>Backend WebSocket Gateway URL</label>
      <input type="text" id="wsUrlInput" />
    </div>

    <button id="toggleBtn" class="mic-btn">Start</button>

    <div class="config-field">
      <label>
        <span>Mic Input (<span id="chunkCounter">0</span> sent)</span>
        <span>Gemini Audio (<span id="rxCounter" style="color:#22c55e;">0</span> received)</span>
      </label>
      <div class="meter-wrap">
        <div id="meterBar" class="meter-bar"></div>
      </div>
    </div>

    <div class="config-field">
      <label>Live Session Log & Tool Execution</label>
      <div id="transcriptBox" class="transcript-box">
        <div style="color: var(--muted); font-size: 0.8rem;">Tap Start and speak in Arabic or English...</div>
      </div>
      <label>Walid Zayed\nWalid.Zayed@FlowBridgeAdvisory.com</label>
    </div>
  </div>

  <script>
    const wsUrlInput = document.getElementById("wsUrlInput");
    const toggleBtn = document.getElementById("toggleBtn");
    const statusBadge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    const errorBox = document.getElementById("errorBox");
    const transcriptBox = document.getElementById("transcriptBox");
    const meterBar = document.getElementById("meterBar");
    const chunkCounter = document.getElementById("chunkCounter");
    const rxCounter = document.getElementById("rxCounter");

    const isSecure = window.location.protocol === "https:";
    const wsProto = isSecure ? "wss:" : "ws:";
    if (window.location.hostname === "localhost" && window.location.port === "3000") {
      wsUrlInput.value = "ws://localhost:8000/ws/voice-crm";
    } else {
      wsUrlInput.value = `${wsProto}//${window.location.host}/ws/voice-crm`;
    }

    let ws = null;
    let inputAudioCtx = null;
    let outputAudioCtx = null;
    let micStream = null;
    let processorNode = null;
    let isConnected = false;
    let scheduledAudioTime = 0;
    let sentChunks = 0;
    let receivedChunks = 0;
    const activeSources = new Set();

    function appendTranscript(role, text) {
      const div = document.createElement("div");
      div.dir = "auto";
      if (role === "user") {
        div.className = "msg-user";
        div.innerText = `You: ${text}`;
      } else if (role === "tool") {
        div.className = "msg-tool";
        div.innerText = text;
      } else if (role === "thought") {
        div.className = "msg-thought";
        div.innerText = `[Thinking]: ${text}`;
      } else {
        div.className = "msg-assistant";
        div.innerText = `Agent: ${text}`;
      }
      transcriptBox.appendChild(div);
      transcriptBox.scrollTop = transcriptBox.scrollHeight;
    }

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.innerText = `Error: ${msg}`;
      console.error("VoiceCRM Error:", msg);
    }

    function clearError() {
      errorBox.style.display = "none";
      errorBox.innerText = "";
    }

    // Downsample arbitrary hardware rate (e.g. 48000 Hz) to clean 16000 Hz Float32Array
    function downsampleTo16k(float32Buffer, inputSampleRate) {
      if (inputSampleRate === 16000) return float32Buffer;
      const ratio = inputSampleRate / 16000;
      const newLength = Math.round(float32Buffer.length / ratio);
      const result = new Float32Array(newLength);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0, count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < float32Buffer.length; i++) {
          accum += float32Buffer[i];
          count++;
        }
        result[offsetResult] = count > 0 ? accum / count : 0;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    toggleBtn.onclick = async () => {
      clearError();
      if (!isConnected) {
        await startAll();
      } else {
        stopAll();
      }
    };

    async function startAll() {
      const url = wsUrlInput.value.trim();
      statusText.innerText = "Requesting mic & connecting...";
      sentChunks = 0;
      receivedChunks = 0;
      chunkCounter.innerText = "0";
      rxCounter.innerText = "0";

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        inputAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        outputAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });

        if (inputAudioCtx.state === "suspended") await inputAudioCtx.resume();
        if (outputAudioCtx.state === "suspended") await outputAudioCtx.resume();

        ws = new WebSocket(url);

        ws.onopen = () => {
          isConnected = true;
          statusBadge.classList.add("connected");
          statusText.innerText = "Live & Listening";
          toggleBtn.innerText = "Stop";
          toggleBtn.classList.add("active");
          transcriptBox.innerHTML = "";
          appendTranscript("assistant", `Connected (v2.2 | Mic Hardware Rate: ${inputAudioCtx.sampleRate}Hz -> 16000Hz). Waiting for greeting...`);

          startMicCapture();
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "error") {
              showError(data.message);
              stopAll();
            } else if (data.type === "audio_delta" && data.audio) {
              receivedChunks++;
              rxCounter.innerText = String(receivedChunks);
              playPcm24k(data.audio);
            } else if (data.type === "transcript" && data.text) {
              appendTranscript(data.role, data.text);
            } else if (data.type === "turn_complete") {
              appendTranscript("assistant", `✓ Audio response complete (${data.audioChunks} packets played).`);
            } else if (data.type === "interrupted") {
              flushAudio();
            }
          } catch (e) {
            console.warn("Parse error:", e);
          }
        };

        ws.onerror = (e) => {
          console.error("WebSocket error:", e);
          showError(`WebSocket error connecting to ${url}`);
        };

        ws.onclose = (e) => {
          console.warn("WebSocket closed:", e.code, e.reason);
          if (e.code === 1008) {
            showError("Access Denied (1008): GEMINI_API_KEY invalid or missing.");
          } else if (e.code !== 1000 && e.code !== 1005) {
            showError(`WebSocket closed (Code: ${e.code})`);
          }
          stopAll();
        };

      } catch (err) {
        showError(err.message || String(err));
        stopAll();
      }
    }

    function startMicCapture() {
      if (!inputAudioCtx || inputAudioCtx.state === "closed") return;

      const hwRate = inputAudioCtx.sampleRate;
      const source = inputAudioCtx.createMediaStreamSource(micStream);
      processorNode = inputAudioCtx.createScriptProcessor(4096, 1, 1);

      processorNode.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        const rawData = e.inputBuffer.getChannelData(0);
        let sumSq = 0;
        for (let i = 0; i < rawData.length; i++) sumSq += rawData[i] * rawData[i];
        const rms = Math.sqrt(sumSq / rawData.length);
        meterBar.style.width = `${Math.min(100, Math.round(rms * 400))}%`;

        // Downsample cleanly to 16000 Hz
        const resampled = downsampleTo16k(rawData, hwRate);
        const pcm16 = new Int16Array(resampled.length);
        for (let i = 0; i < resampled.length; i++) {
          const s = Math.max(-1, Math.min(1, resampled[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        const bytes = new Uint8Array(pcm16.buffer);
        let binary = "";
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }

        ws.send(JSON.stringify({
          type: "audio_input",
          sampleRate: 16000,
          audio: btoa(binary)
        }));

        sentChunks++;
        if (sentChunks % 5 === 0) {
          chunkCounter.innerText = String(sentChunks);
        }
      };

      source.connect(processorNode);
      const muteGain = inputAudioCtx.createGain();
      muteGain.gain.value = 0;
      processorNode.connect(muteGain);
      muteGain.connect(inputAudioCtx.destination);
    }

    function playPcm24k(base64Pcm) {
      if (!outputAudioCtx || outputAudioCtx.state === "closed") return;
      if (outputAudioCtx.state === "suspended") outputAudioCtx.resume();

      const binary = atob(base64Pcm);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

      const buffer = outputAudioCtx.createBuffer(1, float32.length, 24000);
      buffer.copyToChannel(float32, 0);

      const src = outputAudioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(outputAudioCtx.destination);

      const now = outputAudioCtx.currentTime;
      const start = Math.max(now, scheduledAudioTime);
      src.start(start);
      scheduledAudioTime = start + buffer.duration;

      activeSources.add(src);
      src.onended = () => activeSources.delete(src);
    }

    function flushAudio() {
      activeSources.forEach(s => {
        try { s.stop(); } catch (_) {}
      });
      activeSources.clear();
      if (outputAudioCtx && outputAudioCtx.state !== "closed") {
        scheduledAudioTime = outputAudioCtx.currentTime;
      }
    }

    function stopAll() {
      const prevWs = ws;
      ws = null;
      isConnected = false;

      statusBadge.classList.remove("connected");
      statusText.innerText = "Disconnected";
      toggleBtn.innerText = "Start";
      toggleBtn.classList.remove("active");
      meterBar.style.width = "0%";

      if (processorNode) {
        processorNode.disconnect();
        processorNode = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (inputAudioCtx && inputAudioCtx.state !== "closed") {
        inputAudioCtx.close();
      }
      if (outputAudioCtx && outputAudioCtx.state !== "closed") {
        outputAudioCtx.close();
      }
      if (prevWs && prevWs.readyState === WebSocket.OPEN) {
        prevWs.close(1000, "User stopped session");
      }
    }
  </script>
</body>
</html>
