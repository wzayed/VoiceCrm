services:
  voice-crm-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice-crm-backend
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-models/gemini-3.8-live}
    expose:
      - "8000"
    networks:
      - voice-net

  voice-crm-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice-crm-frontend
    restart: unless-stopped
    depends_on:
      - voice-crm-backend
    expose:
      - "80"
    networks:
      - voice-net
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.voice-crm.rule=Host(`${APP_DOMAIN:-voice.flowbridgeadvisory.com}`)"
      - "traefik.http.routers.voice-crm.entrypoints=websecure"
      - "traefik.http.routers.voice-crm.tls=true"
      - "traefik.http.routers.voice-crm.tls.certresolver=letsencrypt"
      - "traefik.http.services.voice-crm.loadbalancer.server.port=80"

networks:
  voice-net:
    driver: bridge
  dokploy-network:
    external: true